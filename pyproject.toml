[build-system]
requires = ["setuptools==70.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-jump-model"
version = "0.1.0"
description = "Reproducible research tools for adaptive statistical jump models"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "hmmlearn==0.3.3",
    "jumpmodels==0.1.1",
    "matplotlib==3.11.0",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "scipy==1.18.0",
    "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
data = [
    "requests==2.34.2",
    "yfinance==1.5.1",
]

[project.scripts]
adaptive-jump = "adaptive_jump.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.20",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# The raw-input hash table: a sha256 is 64 characters and the filename it pins
# has to sit on the same line to be readable as a pair, which cannot fit in 88.
# Wrapping them would make the one thing this table exists for -- checking a
# digest against a name by eye -- harder rather than easier.
"scripts/data/build_external_sources.py" = ["E501"]
# Shu's Table 4, transcribed verbatim into the module docstring so every target
# number in this project has one auditable origin. Reflowing the transcription
# to fit a line limit would destroy the only property it has.
"scripts/_shu_table4.py" = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["adaptive_jump*"]
