schema_version = 1
experiment_id = "lagged-capguard-001"
frozen_at_utc = "2026-08-07T09:52:57Z"
claim_class = "EXPLORATORY"
analysis_label = "CAP-GUARDED LAGGED-EVIDENCE CHALLENGER — US ONLY, BOTH BASELINE GRIDS"
hypothesis = "ajm-ext-001's corrected closure localized the challenger's failure to cap-binding selections: the one-sided lagged discount can only cheapen switching, so in months where the paired fixed JM's CV selects the TOP of the lambda grid (the market demanding maximum persistence) the discount manufactures whipsaw (JP 4.8x / EU 2.9x switch inflation at the binding cells; no mechanism at NA where fixed never capped). A cap-guarded composition - use the fixed path in fixed-at-top months, the lagged_log4 challenger elsewhere - should therefore repair the worst-grid delta without a single new parameter."
primary_estimand = "min_over_grids(sharpe_delta_vs_paired_fixed) for capguard versus plain lagged_log4, US, delay 1"
extension_access = false
adaptive_experiment = true
model_refitting = true

# Disclosures at freeze (all stated before any number exists):
# 1. US through-2023 is repeatedly inspected development data. Whatever the
#    direction of the result, the claim class stays EXPLORATORY; no
#    confirmation is possible here (the AP-ex-Japan confirmation region was
#    burned by ajm-ext-001's stopping rule and no substitute exists).
# 2. Owner instruction 2026-08-07: US only ("chi test tren US thoi").
# 3. The 5-seed US noise floor measured in the P0 era was ~+-0.03 Sharpe;
#    the frozen tolerance below uses 0.05 (the repo's standing rent).
# 4. beta is FROZEN at ln 4 = 1.3862943611198906, the dev-supported
#    mechanism's value (lagged-evidence-mechanism-001). No beta search.
# 5. The capguard has ZERO free parameters and nests both parents: it equals
#    plain lagged_log4 when no month is cap-binding and equals fixed JM when
#    every month is. Guard information is causal: the fixed arm's monthly CV
#    choice is made at the decision date from trailing data only.
# 6. Grid G2's fixed leg is the CALIBRATED v10 baseline; its cells agree with
#    the published tables by construction and nothing here is a replication
#    claim. G1 uses the six lambda values Table 3 illustrates (paper lines
#    ~620-646); the paper never discloses these as its actual
#    production/selection grid. G1 is used here only as one predeclared
#    candidate, exactly like G2, and neither constitutes a replication claim.
prior_art = "ajm-ext-001 EXPERIMENT_COMPLETE + CORRECTION (binding spec = short grid; whipsaw measured at JP/EU binding cells, absent at NA); lagged-evidence-mechanism-001/-performance-001 (dev-supported log4 mechanism); baseline-reseal-v10; jm-grid-identification-001 (v9.4 selected-path anchors)"

[inputs]
frame = "sealed v10 US features (artifacts/fixed-baselines/fixed-baselines-36ca1ace131c-ed7abd7daea3-f9f3e0a93736/us/features.csv) - date, equity_simple, cash_return, excess_return + the three raw features; scaling happens inside the sealed engine per refit"
configs = "research-expanding-v9-4.toml supplies G1's protocols; research-calibrated-v10.toml supplies G2's (per-market us override)"
grids = { g1_table3 = [0.0, 5.0, 15.0, 35.0, 70.0, 150.0], g2_v10_us = [0.0, 21.544346900318832, 70.0] }
beta = 1.3862943611198906
delay_trading_days = 1
one_way_cost_bps = 10.0
oos_window = ["1990-01-01", "2023-12-31"]

[construction]
fixed_leg = "fixed_jm_states(include_fit_diagnostics=True) on the sealed frame under each grid's own config"
challenger_leg = "ajm_ext_arms.challenger_states at the frozen beta (its internal beta-zero gate must pass on every day)"
capguard = "per monthly decision block b (the fixed arm's selection calendar): capguard_signal[d in b] = fixed_signal[d] if fixed_choice[b] == max(grid) else lagged_signal[d]"
selection = "select_monthly_candidate under each grid's own [selection] protocol, delay 1, 10bp, for the fixed and lagged arms independently; capguard composes and never re-selects"

[gates_before_readout]
g1_fixed_states = "bit-identical to the Table-3 columns of artifacts/jm-residual/01-grid-identification/us/union-states.csv on every populated cell"
g2_fixed_states = "bit-identical to the sealed v10 us jm-states.csv on every populated cell"
g1_fixed_selection_anchors = "34 shifts / 0.21868067717454753 bear / 8565 days on the OOS window (selected-anchors.csv)"
g2_fixed_selection = "signal identical to the sealed v10 us fixed_jm-delay-1/selected-signal.csv and choices identical to choices.csv"
g2_fixed_sharpe = "equals the sealed v10 metrics.csv us/fixed_jm/delay-1 sharpe within 1e-9 on the sealed metrics window"
beta_zero_nesting = "challenger_states' internal gate (raises on any daily mismatch)"
recomposition_identity = "recomposing the fixed signal from fixed choices + per-lambda state columns via the block map must reproduce selection.signal exactly; the same block map then builds the capguard"

[readout]
# R2 is primary and frozen. delta_g(model) = sharpe(model, g) - sharpe(fixed, g)
# on the OOS window at delay 1; min over g in {g1_table3, g2_v10_us}.
r2_rule = "SUPPORTED iff min_g delta(capguard) > min_g delta(lagged) AND min_g delta(capguard) >= -0.05. Anything else NOT SUPPORTED. If no month is cap-binding on either grid the experiment is VACUOUS-BY-CONSTRUCTION and is recorded as such instead."
r1_mechanism = "on g1_table3: excess OOS position-switches of lagged vs fixed, attributed to fixed-at-top vs other months; mechanism-localized iff >= 50% of the excess falls in fixed-at-top months; if lagged has no excess switches, record 'no excess to localize' (descriptive either way)"
r3_bind_rate = "descriptive: fraction of monthly decisions with fixed at the grid top, per grid"
sharpe_tolerance = 0.05

[decision]
winner_selection_allowed = false
config_changes_allowed = false
grid_candidacy_from_results = "forbidden"
registered_interpretations = [
  "SUPPORTED motivates (does not constitute) a future confirmatory transport test of capguard on fresh regional data under a NEW experiment id with a NEW confirmation region",
  "NOT SUPPORTED closes the cap-guard idea for the lagged mechanism; the standing queue continues with semi-Markov dwell cost, which needs its own frozen question",
  "VACUOUS-BY-CONSTRUCTION (no cap-binding months) means US dev cannot exercise the guard and the idea stays untested here; it may only be retried where grids bind, under a new id",
]

[storage]
artifact_subdir = "artifacts/lagged-capguard/01-us"
required_outputs = ["metrics.csv", "switch-attribution.csv", "bind-rate.csv", "readout.json", "report.txt"]
